<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Caixa #{{ caixa.id }}</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            width: 300px;
            margin: 0 auto;
            padding: 10px;
            color: #000;
            background-color: #fff;
        }
        .header {
            text-align: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .header h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        .header p {
            margin: 0;
            font-size: 13px;
        }
        .linha {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 13px;
        }
        .total {
            border-top: 1px dashed #000;
            border-bottom: 1px dashed #000;
            padding: 8px 0;
            margin-top: 10px;
            font-weight: bold;
            font-size: 15px;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
        }
        .btn-imprimir {
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body onload="window.print()">

    <div class="header">
        <h2>🧾 RELATÓRIO DE CAIXA</h2>
        <p>Registro #{{ caixa.id }}</p>
    </div>

    <div class="linha">
        <span>Abertura:</span>
        <span>{{ caixa.abertura }}</span>
    </div>
    <div class="linha">
        <span>Fechamento:</span>
        <span>{{ caixa.fechamento }}</span>
    </div>

    <hr style="border: none; border-top: 1px dashed #000; margin: 10px 0;">

    <div class="linha">
        <span>Fundo Inicial:</span>
        <span>R$ {{ caixa.valor_inicial }}</span>
    </div>
    <div class="linha">
        <span>Vendas do Período:</span>
        <span>R$ {{ caixa.vendas }}</span>
    </div>

    <div class="linha total">
        <span>SALDO FINAL:</span>
        <span>R$ {{ caixa.saldo_final }}</span>
    </div>

    <div class="footer">
        <p>Reimpressão emitida em:<br>
            <script>document.write(new Date().toLocaleString('pt-BR'));</script>
        </p>
        <button class="no-print btn-imprimir" onclick="window.print()">🖨️ Imprimir Novamente</button>
    </div>

</body>
</html>
