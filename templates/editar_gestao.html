<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Ajustar Produto</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>
        ✏️ Ajustar Produto
    </h1>

    <form
    action="/salvar-gestao/{{ produto.id }}"
    method="POST">

        <label>
            Preço de venda
        </label>

        <input
        type="number"
        step="0.01"
        name="preco"
        value="{{ produto.preco }}"
        required>

        <br><br>

        <label>
            Custo
        </label>

        <input
        type="number"
        step="0.01"
        name="custo"
        value="{{ produto.custo }}"
        required>

        <br><br>

        <label>
            Estoque
        </label>

        <input
        type="number"
        name="estoque"
        value="{{ produto.estoque }}"
        required>

        <br><br>

        <label>
            Estoque mínimo
        </label>

        <input
        type="number"
        name="estoque_minimo"
        value="{{ produto.estoque_minimo }}"
        required>

        <br><br>

        <button type="submit">

            💾 Salvar Ajustes

        </button>

    </form>

    <br>

    <a href="/gestao">

        <button>

            ⬅ Voltar

        </button>

    </a>

</div>

</body>
</html>
