<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Definir Senha Oficial</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .erro-alerta { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 Primeiro Acesso</h2>
        <p>Por segurança, mude a senha temporária para a sua senha oficial.</p>

        <!-- Exibe mensagem de erro do Python caso haja divergência -->
        {% if erro %}
            <div class="erro-alerta">
                {{ erro }}
            </div>
        {% endif %}

        <form action="/salvar-nova-senha" method="POST" onsubmit="return validarCampos()">
            <input type="password" id="nova_senha" name="nova_senha" placeholder="Digite sua senha oficial" required>
            <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirme sua senha oficial" required>
            <button type="submit">Gravar Senha Oficial</button>
        </form>
    </div>

    <script>
        function validarCampos() {
            var p1 = document.getElementById("nova_senha").value;
            var p2 = document.getElementById("confirmar_senha").value;

            if (p1 !== p2) {
                alert("⚠️ As senhas não conferem!\nDigite a mesma senha nos dois campos para continuar.");
                return false; // Impede o envio do formulário
            }
            return true;
        }
    </script>
</body>
</html>
