<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #059669; }
        .erro-msg { color: #dc3545; background-color: #f8d7da; padding: 10px; border-radius: 4px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 Criar Nova Senha</h2>
        
        {% if erro %}
            <div class="erro-msg">{{ erro }}</div>
        {% endif %}

        <form method="POST" onsubmit="return validarSenhas()">
            <input type="password" id="nova_senha" name="nova_senha" placeholder="Digite a nova senha" required>
            <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirme a nova senha" required>
            <button type="submit">Atualizar Senha</button>
        </form>
    </div>

    <script>
        function validarSenhas() {
            var s1 = document.getElementById("nova_senha").value;
            var s2 = document.getElementById("confirmar_senha").value;
            if (s1 !== s2) {
                alert("⚠️ As senhas não coincidem!");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
