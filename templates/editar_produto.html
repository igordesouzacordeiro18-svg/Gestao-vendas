<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Editar Produto</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>✏️ Editar Produto</h1>

        <form
action="/atualizar-produto/{{ produto.id }}"
method="POST"
onsubmit="return confirm('Salvar alterações deste produto?')">

            <input
            type="text"
            name="nome"
            value="{{ produto.nome }}"
            required>

            <input
            type="number"
            step="0.01"
            name="preco"
            value="{{ produto.preco }}"
            required>

            <button type="submit">
                💾 Salvar Alterações
            </button>

        </form>

        <br>

        <a href="/produtos">

            <button>
                ⬅ Voltar
            </button>

        </a>

    </div>

</body>
</html>
