<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        a { text-decoration: none; color: #6c757d; font-size: 14px; display: inline-block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔑 Recuperar Senha</h2>
        <p>Digite seu e-mail cadastrado para receber o link de redefinição.</p>
        <form action="/esqueci-senha" method="POST">
            <input type="email" name="email" placeholder="Seu e-mail cadastrado" required>
            <button type="submit">Enviar Link de Recuperação</button>
        </form>
        <a href="/">← Voltar ao Login</a>
    </div>
</body>
</html>
